[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "lidar-perception-workbench"
version = "0.1.0"
description = "Point-cloud geometry, observed landing candidates and process isolation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
[project.optional-dependencies]
fast = ["scipy>=1.10"]
viewer = ["PyQt5>=5.15", "pyqtgraph>=0.13", "PyOpenGL>=3.1"]
registration = ["open3d>=0.18"]
[project.scripts]
lidar-workbench-demo = "lidar_workbench.demo:main"
[tool.setuptools.packages.find]
where = ["src"]
